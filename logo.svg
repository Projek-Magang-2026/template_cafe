<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#3C2415" />
  <circle cx="50" cy="50" r="42" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
  
  <!-- Steam / WiFi Waves rising from cup -->
  <!-- Outer Wave -->
  <path d="M30 38 A28 28 0 0 1 70 38" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.35" fill="none" />
  <!-- Middle Wave -->
  <path d="M36 44 A20 20 0 0 1 64 44" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.6" fill="none" />
  <!-- Inner Wave -->
  <path d="M42 50 A12 12 0 0 1 58 50" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" />
  
  <!-- Coffee Cup Body -->
  <path d="M32 58 L68 58 L64 78 L36 78 Z" fill="#ffffff" rx="2" />
  
  <!-- Cup Detail Lines -->
  <path d="M34 66 L66 66" stroke="#3C2415" stroke-width="1" opacity="0.15" />
  <path d="M35 72 L65 72" stroke="#3C2415" stroke-width="1" opacity="0.15" />
  
  <!-- Coffee liquid surface -->
  <path d="M34 60 L66 60" stroke="#C8956C" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Cup Handle -->
  <path d="M68 62 C76 62, 76 74, 68 74" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" />
  
  <!-- Saucer -->
  <ellipse cx="50" cy="80" rx="22" ry="3" fill="rgba(255,255,255,0.3)" />
  
  <!-- WiFi dot at top -->
  <circle cx="50" cy="33" r="2.5" fill="#C8956C" />
</svg>
